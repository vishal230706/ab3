<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Employee Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Employee Management System</h2>

        <a th:href="@{/employees/new}"
           class="btn btn-primary">
            Add Employee
        </a>

    </div>

    <table class="table table-bordered table-hover shadow">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Designation</th>
            <th>Salary</th>
            <th>Status</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="employee : ${employees}">

            <td th:text="${employee.employeeId}"></td>

            <td th:text="${employee.firstName + ' ' + employee.lastName}"></td>

            <td th:text="${employee.email}"></td>

            <td th:text="${employee.department}"></td>

            <td th:text="${employee.designation}"></td>

            <td th:text="${employee.salary}"></td>

            <td th:text="${employee.status}"></td>

            <td>

                <a th:href="@{/employees/edit/{id}(id=${employee.employeeId})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/employees/delete/{id}(id=${employee.employeeId})}"
                   class="btn btn-danger btn-sm">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
